name: Actualiser les données YannDrive

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Récupérer les cours
        run: node scripts/update-market-data.mjs
      - name: Récupérer l’état des ponts HAROPA
        run: node scripts/update-bridge-data.mjs
      - name: Publier les nouvelles valeurs
        run: |
          git config user.name "YannDrive Bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/markets.json data/bridges.json
          git diff --cached --quiet || git commit -m "Update market data"
          git push
