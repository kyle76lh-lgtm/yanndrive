<!doctype html><html lang="fr"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LHdrive · Galaxie</title><style>
*{box-sizing:border-box}body{margin:0;background:#050711;color:#eef2ff;font-family:system-ui}#scene{position:fixed;inset:0;touch-action:none}canvas{display:block}.header{position:absolute;top:28px;left:32px;pointer-events:none}h1{font-size:36px;margin:8px 0;letter-spacing:-1px}.eyebrow{font-size:11px;letter-spacing:3px;color:#c2a6ff}.panel{position:absolute;bottom:24px;right:24px;width:320px;padding:22px;background:#0d1224dd;border:1px solid #343550;border-radius:20px;backdrop-filter:blur(15px)}label{display:block;font-size:13px;color:#bcc3dd;margin:14px 0 8px}input[type=range],select{width:100%;accent-color:#e791ff}select,button{font:inherit;color:#eef2ff;background:#242b46;border:1px solid #494b70;border-radius:10px;padding:10px}button{cursor:pointer}button:hover{background:#3a3b61}.buttons{display:flex;gap:8px;margin-top:16px}.note{font-size:11px;color:#929cbf;line-height:1.6}#status{color:#a2e4cd;font-size:12px}.hint{position:absolute;bottom:25px;left:32px;color:#8694b6;font-size:12px}@media(max-width:650px){.panel{width:calc(100% - 28px);right:14px;bottom:14px;padding:15px}.header{top:16px;left:20px}.hint{display:none}h1{font-size:28px}} 
</style><div id="scene"></div><div class="header"><div class="eyebrow">LHDRIVE / GALAXIE</div><h1>Une galaxie à bord.</h1><div id="status">Chargement de la scène…</div></div><div class="hint">Glisse pour changer l’angle · molette pour zoomer</div><section class="panel"><strong>Explorer la galaxie</strong><label for="speed">Vitesse simulée : <span id="value">35</span> km/h</label><input id="speed" type="range" min="0" max="160" value="35"><label for="quality">Densité des étoiles</label><select id="quality"><option value="10000">Légère · 10 000</option><option value="35000" selected>Standard · 35 000</option><option value="70000">Dense · 70 000</option></select><label><input type="checkbox" id="auto" checked> Rotation automatique</label><div class="buttons"><button id="warp">✦ Hyperespace</button><button id="reset">Vue initiale</button></div><p class="note">Scène interactive · rendu WebGL · réglage de rotation indépendant du GPS.</p></section>
<script type="module">
let galaxyVisible=false;
window.addEventListener("message",event=>{if(event.source===parent&&event.origin===location.origin&&event.data?.type==="galaxy-visible")galaxyVisible=event.data.visible===true;});
try{
const T=await import('./assets/vendor/three.module.js');
const $=id=>document.getElementById(id),scene=new T.Scene(),camera=new T.PerspectiveCamera(50,innerWidth/innerHeight,.1,100);
const renderer=new T.WebGLRenderer({antialias:false});renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));$("scene").append(renderer.domElement);renderer.setClearColor(0x050711);
const galaxy=new T.Group();scene.add(galaxy);let points,geometry,material;let pitch=.75,yaw=0,distance=10,speed=35,warpUntil=0,drag=false,lastX=0,lastY=0;
const spriteCanvas=document.createElement('canvas');spriteCanvas.width=spriteCanvas.height=64;const ctx=spriteCanvas.getContext('2d'),gradient=ctx.createRadialGradient(32,32,0,32,32,32);gradient.addColorStop(0,'rgba(255,255,255,1)');gradient.addColorStop(.18,'rgba(255,255,255,.9)');gradient.addColorStop(.5,'rgba(255,255,255,.2)');gradient.addColorStop(1,'rgba(255,255,255,0)');ctx.fillStyle=gradient;ctx.fillRect(0,0,64,64);const texture=new T.CanvasTexture(spriteCanvas);
function build(count){if(points){galaxy.remove(points);geometry.dispose();material.dispose();}const positions=new Float32Array(count*3),colors=new Float32Array(count*3),inside=new T.Color('#ffc88a'),outside=new T.Color('#9b5dff');for(let i=0;i<count;i++){const r=Math.pow(Math.random(),.65)*4.4,branch=(i%5)/5*Math.PI*2,angle=branch+r*1.45;const scatter=Math.pow(Math.random(),3)*.65*(Math.random()<.5?-1:1);positions[i*3]=Math.cos(angle)*r+scatter*r*.25;positions[i*3+1]=(Math.random()-.5)*.14*(1+r*.35);positions[i*3+2]=Math.sin(angle)*r+Math.pow(Math.random(),3)*r*.25*(Math.random()<.5?-1:1);const color=inside.clone().lerp(outside,r/4.4);colors[i*3]=color.r;colors[i*3+1]=color.g;colors[i*3+2]=color.b;}geometry=new T.BufferGeometry();geometry.setAttribute('position',new T.BufferAttribute(positions,3));geometry.setAttribute('color',new T.BufferAttribute(colors,3));material=new T.PointsMaterial({size:.065,map:texture,vertexColors:true,transparent:true,blending:T.AdditiveBlending,depthWrite:false,sizeAttenuation:true});points=new T.Points(geometry,material);galaxy.add(points);}
build(35000);

const starPositions=new Float32Array(5000*3),starColors=new Float32Array(5000*3);
for(let i=0;i<5000;i++){const angle=Math.random()*Math.PI*2,z=Math.random()*2-1,r=22+Math.random()*15,s=Math.sqrt(1-z*z);starPositions[i*3]=Math.cos(angle)*s*r;starPositions[i*3+1]=z*r;starPositions[i*3+2]=Math.sin(angle)*s*r;const tint=new T.Color().setHSL(.56+Math.random()*.12,.12+Math.random()*.25,.55+Math.random()*.4);starColors[i*3]=tint.r;starColors[i*3+1]=tint.g;starColors[i*3+2]=tint.b;}
const stars=new T.Points(new T.BufferGeometry().setAttribute('position',new T.BufferAttribute(starPositions,3)).setAttribute('color',new T.BufferAttribute(starColors,3)),new T.PointsMaterial({vertexColors:true,map:texture,size:.12,transparent:true,opacity:.85,blending:T.AdditiveBlending,depthWrite:false}));scene.add(stars);
$("speed").oninput=e=>{speed=Number(e.target.value);$("value").textContent=speed;};$("quality").onchange=e=>build(Number(e.target.value));$("warp").onclick=()=>warpUntil=performance.now()+2600;$("reset").onclick=()=>{pitch=.75;yaw=0;distance=10;};
const target=$("scene");target.onpointerdown=e=>{drag=true;lastX=e.clientX;lastY=e.clientY;target.setPointerCapture(e.pointerId)};target.onpointermove=e=>{if(drag){yaw-=(e.clientX-lastX)*.005;pitch=Math.max(.1,Math.min(1.5,pitch+(e.clientY-lastY)*.005));lastX=e.clientX;lastY=e.clientY;}};target.onpointerup=target.onpointercancel=()=>drag=false;target.addEventListener('wheel',e=>{e.preventDefault();distance=Math.max(5,Math.min(18,distance+e.deltaY*.008));},{passive:false});
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;let previous=performance.now(),frames=0,fpsTime=previous;
parent.postMessage({type:"galaxy-ready"},location.origin);
function animate(now){if(!galaxyVisible||document.hidden){previous=now;requestAnimationFrame(animate);return;}const dt=Math.min(.05,(now-previous)/1000);previous=now;if($("auto").checked&&!reduced)galaxy.rotation.y+=dt*(.035+speed*.0015);const warp=Math.max(0,(warpUntil-now)/2600);const pulse=!reduced&&warp>0?Math.sin((1-warp)*Math.PI):0;galaxy.scale.setScalar(1+pulse*.25);material.size=.065+pulse*.065;const d=distance-pulse*2.5;camera.position.set(Math.sin(yaw)*Math.cos(pitch)*d,Math.sin(pitch)*d,Math.cos(yaw)*Math.cos(pitch)*d);camera.lookAt(0,0,0);renderer.render(scene,camera);frames++;if(now-fpsTime>1000){$("status").textContent="Scène active · "+Math.round(frames*1000/(now-fpsTime))+" images/s";frames=0;fpsTime=now;}requestAnimationFrame(animate);}requestAnimationFrame(animate);
}catch(e){document.getElementById('status').textContent="Impossible de démarrer : "+e.message;}
</script></html>
